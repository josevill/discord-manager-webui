name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly live E2E against the disposable guild (secrets-gated).
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, build, tests, coverage, WebUI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit + integration + coverage gate
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: WebUI self-tests (Playwright)
        run: npm run test:web

  e2e:
    name: Live E2E (disposable guild)
    # Manual (workflow_dispatch) or nightly (schedule) only — never on push/PR.
    # Skips (green) when no E2E secrets are configured; fails on partial/mismatched config.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check E2E credentials
        id: creds
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          E2E_ALLOW_GUILD_ID: ${{ secrets.E2E_ALLOW_GUILD_ID }}
        run: |
          set -eu
          present=0
          if [ -n "${DISCORD_TOKEN:-}" ]; then present=$((present + 1)); fi
          if [ -n "${DISCORD_GUILD_ID:-}" ]; then present=$((present + 1)); fi
          if [ -n "${E2E_ALLOW_GUILD_ID:-}" ]; then present=$((present + 1)); fi
          # No E2E secrets at all: E2E is simply not enabled for this repo —
          # skip so scheduled runs stay green instead of failing nightly.
          if [ "$present" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DISCORD_TOKEN / DISCORD_GUILD_ID / E2E_ALLOW_GUILD_ID are not set — skipping live E2E."
            exit 0
          fi
          # Partially configured or mismatched: misconfiguration — fail loudly.
          [ -n "${DISCORD_TOKEN:-}" ] || { echo "::error::DISCORD_TOKEN secret is required"; exit 1; }
          [ -n "${DISCORD_GUILD_ID:-}" ] || { echo "::error::DISCORD_GUILD_ID secret is required"; exit 1; }
          [ -n "${E2E_ALLOW_GUILD_ID:-}" ] || { echo "::error::E2E_ALLOW_GUILD_ID secret is required (no default-allow)"; exit 1; }
          [ "${DISCORD_GUILD_ID:-}" = "${E2E_ALLOW_GUILD_ID:-}" ] || { echo "::error::E2E_ALLOW_GUILD_ID must exactly match DISCORD_GUILD_ID"; exit 1; }

      - name: Install dependencies
        if: steps.creds.outputs.skip != 'true'
        run: npm ci

      - name: Run live E2E
        if: steps.creds.outputs.skip != 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          E2E_ALLOW_GUILD_ID: ${{ secrets.E2E_ALLOW_GUILD_ID }}
        run: npm run test:e2e
